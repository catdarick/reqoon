# Push a tag like v0.2.0 to build installers for macOS, Windows and Linux,
# publish them as a GitHub release and update the Homebrew cask in Casks/.
# Builds are unsigned (see "Install" in the README).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The toolchain itself comes from rust-toolchain.toml.
      - name: Rust targets
        if: startsWith(matrix.platform, 'macos')
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Reqoon ${{ env.TAG }}
          releaseBody: |
            See the README for install instructions.

            macOS builds are not notarized: install with Homebrew, or run `xattr -cr /Applications/Reqoon.app` once after copying the app.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  cask:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update Casks/reqoon.rb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${TAG#v}
          gh release download "$TAG" --pattern "Reqoon_${version}_universal.dmg" --dir /tmp/dmg
          sha=$(sha256sum "/tmp/dmg/Reqoon_${version}_universal.dmg" | cut -d' ' -f1)
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 .*/  sha256 \"$sha\"/; s#github.com/[^/]+/[^/]+/releases#github.com/${GITHUB_REPOSITORY}/releases#; s#^  homepage \".*\"#  homepage \"https://github.com/${GITHUB_REPOSITORY}\"#" Casks/reqoon.rb
          cat Casks/reqoon.rb

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/reqoon.rb
          git diff --cached --quiet && exit 0
          git commit -m "Cask: Reqoon ${TAG#v}"
          git push
